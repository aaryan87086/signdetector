<!DOCTYPE html>
<html>
<head>
    <title>Hand Test</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <a-entity id="rig">
            <a-entity camera look-controls position="0 1.6 0"></a-entity>
        </a-entity>

        <a-text id="status" value="Waiting for VR..." position="0 2 -2" align="center" color="white" width="6"></a-text>

        <a-sky color="#222"></a-sky>
    </a-scene>

    <script>
        const statusEl = document.querySelector('#status');
        const sceneEl = document.querySelector('a-scene');

        sceneEl.addEventListener('enter-vr', () => {
            statusEl.setAttribute('value', 'Entered VR');

            sceneEl.renderer.xr.addEventListener('sessionstart', () => {
                const session = sceneEl.renderer.xr.getSession();
                statusEl.setAttribute('value', 'Session started');

                sceneEl.renderer.setAnimationLoop((time, frame) => {
                    const session = sceneEl.renderer.xr.getSession();
                    if (!session) {
                        statusEl.setAttribute('value', 'No session');
                        return;
                    }

                    let sources = session.inputSources.length;
                    let handsFound = 0;
                    let info = 'Sources: ' + sources;

                    for (const src of session.inputSources) {
                        info += ' | ' + src.handedness + ':' + (src.hand ? 'HAND' : 'CONTROLLER');
                        if (src.hand) handsFound++;
                    }

                    statusEl.setAttribute('value', info);
                });
            });
        });
    </script>
</body>
</html>
