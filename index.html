<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISL VR Gesture Recognition</title>
    <!-- A-Frame Framework -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
    <a-scene webxr="optionalFeatures: hand-tracking;">
        <a-assets>
            <a-mixin id="font-style" text="align: center; color: #FFFFFF; font: roboto"></a-mixin>
        </a-assets>

        <!-- Camera Rig -->
        <a-entity id="rig" position="0 0 0">
            <a-camera position="0 1.6 0" look-controls></a-camera>

            <!-- Real VR Hand Entities -->
            <a-entity id="leftHand" hand-tracking-controls="hand: left;" isl-gesture-detector="hand: left"></a-entity>
            <a-entity id="rightHand" hand-tracking-controls="hand: right;" isl-gesture-detector="hand: right"></a-entity>

            <!-- Simulator Hands for Desktop / Testing -->
            <a-entity id="simLeftHand" position="-0.25 1.4 -0.5" visible="false">
                <a-sphere radius="0.04" color="#3B82F6" opacity="0.8"></a-sphere>
                <a-text value="Left Hand" position="0 0.08 0" scale="0.3 0.3 0.3" align="center"></a-text>
            </a-entity>
            <a-entity id="simRightHand" position="0.25 1.4 -0.5" visible="false">
                <a-sphere radius="0.04" color="#10B981" opacity="0.8"></a-sphere>
                <a-text value="Right Hand" position="0 0.08 0" scale="0.3 0.3 0.3" align="center"></a-text>
            </a-entity>
        </a-entity>

        <!-- UI Feedback Panel in 3D Space -->
        <a-entity id="ui-panel" position="0 1.8 -1.8">
            <a-plane width="1.8" height="0.9" color="#0F172A" opacity="0.85" material="transparent: true; shader: flat" radius="0.05">
                <a-text id="target-instruction" value="Target: Thumbs Up" position="0 0.28 0.01" scale="0.8 0.8 0.8" mixin="font-style" color="#38BDF8"></a-text>
                <a-text id="detected-gesture" value="Detected: None" position="0 0.08 0.01" scale="0.6 0.6 0.6" mixin="font-style" color="#94A3B8"></a-text>
                <a-text id="status-feedback" value="Perform the sign with your hands" position="0 -0.12 0.01" scale="0.7 0.7 0.7" mixin="font-style" color="#FACC15"></a-text>
                
                <!-- Controls instruction for non-VR simulator -->
                <a-text id="sim-info" value="Desktop Test: Press 1 (Thumbs Up), 2 (Namaste), 3 (Bye)" position="0 -0.32 0.01" scale="0.35 0.35 0.35" mixin="font-style" color="#64748B"></a-text>
            </a-plane>
        </a-entity>

        <!-- Environment Elements -->
        <a-sky color="#090D16"></a-sky>
        <a-grid position="0 0 0" color="#1E293B" sectionColor="#334155"></a-grid>
        <a-light type="ambient" color="#FFFFFF" intensity="0.6"></a-light>
        <a-light type="directional" position="1 4 1" intensity="0.8"></a-light>
    </a-scene>

    <script>
        // Global state for multi-hand tracking (e.g., Namaste requires both hands)
        const handData = {
            left: { present: false, joints: {}, wristPos: new THREE.Vector3() },
            right: { present: false, joints: {}, wristPos: new THREE.Vector3() }
        };

        const targets = ['Thumbs Up', 'Namaste', 'Bye'];
        let currentTargetIdx = 0;
        let lastGestureTime = 0;

        // Custom Component for Robust WebXR Hand Joint Analysis
        AFRAME.registerComponent('isl-gesture-detector', {
            schema: {
                hand: { type: 'string', default: 'right' }
            },

            init: function () {
                this.handComp = this.el.components['hand-tracking-controls'];
                this.wristVector = new THREE.Vector3();
                this.jointVectors = {};

                // Listen for WebXR hand tracking events
                this.el.addEventListener('hand-tracking-stars', () => {
                    handData[this.data.hand].present = true;
                });
                this.el.addEventListener('hand-tracking-lost', () => {
                    handData[this.data.hand].present = false;
                });
            },

            tick: function (time) {
                const handComp = this.el.components['hand-tracking-controls'];
                if (!handComp || !handComp.mesh || !handComp.mesh.visible) {
                    handData[this.data.hand].present = false;
                    return;
                }

                handData[this.data.hand].present = true;

                // Extract WebXR Joints from Mesh / Bone structure
                const joints = handComp.jointPoints || (handComp.indexToJointsMap ? handComp.indexToJointsMap : null);
                const bones = handComp.bones;

                // Obtain key joint positions in world coordinates
                const getJointPos = (jointName) => {
                    if (handComp.getJointMesh) {
                        const jMesh = handComp.getJointMesh(jointName);
                        if (jMesh) {
                            const vec = new THREE.Vector3();
                            jMesh.getWorldPosition(vec);
                            return vec;
                        }
                    }
                    if (bones && bones.length > 0) {
                        const bone = bones.find(b => b.name === jointName || b.jointName === jointName);
                        if (bone) {
                            const vec = new THREE.Vector3();
                            bone.getWorldPosition(vec);
                            return vec;
                        }
                    }
                    return null;
                };

                const wrist = getJointPos('wrist');
                const thumbTip = getJointPos('thumb-tip');
                const indexTip = getJointPos('index-finger-tip');
                const middleTip = getJointPos('middle-finger-tip');
                const ringTip = getJointPos('ring-finger-tip');
                const pinkyTip = getJointPos('pinky-finger-tip');

                if (wrist) {
                    handData[this.data.hand].wristPos.copy(wrist);
                    handData[this.data.hand].joints = {
                        wrist, thumbTip, indexTip, middleTip, ringTip, pinkyTip
                    };
                }

                // Master gesture evaluation running on tick loop
                if (this.data.hand === 'right') {
                    evaluateGestures(time);
                }
            }
        });

        // Gesture Evaluation Logic
        function evaluateGestures(currentTime) {
            const right = handData.right;
            const left = handData.left;

            let detected = "None";

            // 1. NAMASTE GESTURE (Both hands active & close together near center)
            if (right.present && left.present && right.joints.wrist && left.joints.wrist) {
                const distance = right.wristPos.distanceTo(left.wristPos);
                if (distance < 0.22) { // Hands brought close together (< 22cm)
                    detected = "Namaste";
                }
            }

            // 2. SINGLE HAND GESTURES (Evaluated if Namaste not triggered)
            if (detected === "None" && right.present && right.joints.wrist) {
                const w = right.joints.wrist;
                const tt = right.joints.thumbTip;
                const it = right.joints.indexTip;
                const mt = right.joints.middleTip;
                const rt = right.joints.ringTip;
                const pt = right.joints.pinkyTip;

                if (tt && it && mt && rt && pt) {
                    const dThumb = w.distanceTo(tt);
                    const dIndex = w.distanceTo(it);
                    const dMiddle = w.distanceTo(mt);
                    const dRing = w.distanceTo(rt);
                    const dPinky = w.distanceTo(pt);

                    // Thumbs Up: Thumb extended, all other 4 fingers curled close to wrist
                    const thumbExtended = dThumb > 0.095;
                    const fingersCurled = dIndex < 0.085 && dMiddle < 0.085 && dRing < 0.085 && dPinky < 0.085;

                    // Bye / Wave: All 5 fingers extended outward
                    const allExtended = dThumb > 0.09 && dIndex > 0.11 && dMiddle > 0.12 && dRing > 0.11 && dPinky > 0.09;

                    if (thumbExtended && fingersCurled) {
                        detected = "Thumbs Up";
                    } else if (allExtended) {
                        detected = "Bye";
                    }
                }
            }

            updateUI(detected, currentTime);
        }

        // Update 3D UI Feedback & Progress Targets
        function updateUI(detected, currentTime) {
            const targetName = targets[currentTargetIdx];
            const detectedEl = document.querySelector('#detected-gesture');
            const statusEl = document.querySelector('#status-feedback');
            const targetEl = document.querySelector('#target-instruction');

            targetEl.setAttribute('value', `Target: ${targetName}`);
            detectedEl.setAttribute('value', `Detected: ${detected}`);

            if (detected === targetName) {
                statusEl.setAttribute('value', 'EXCELLENT! MATCH CONFIRMED!');
                statusEl.setAttribute('color', '#10B981'); // Green

                // Auto advance to next target gesture after 2 seconds cooldown
                if (currentTime - lastGestureTime > 2000) {
                    lastGestureTime = currentTime;
                    currentTargetIdx = (currentTargetIdx + 1) % targets.length;
                }
            } else if (detected !== "None") {
                statusEl.setAttribute('value', `Detected ${detected}. Try ${targetName}`);
                statusEl.setAttribute('color', '#F59E0B'); // Orange
            } else {
                statusEl.setAttribute('value', 'Perform the gesture with VR Hands');
                statusEl.setAttribute('color', '#FACC15'); // Yellow
            }
        }

        // Simulator Fallback Keyboard Controls for Desktop Testing
        window.addEventListener('keydown', (e) => {
            const simLeft = document.querySelector('#simLeftHand');
            const simRight = document.querySelector('#simRightHand');

            let simDetected = null;

            if (e.key === '1') {
                simDetected = "Thumbs Up";
                simLeft.setAttribute('visible', 'false');
                simRight.setAttribute('visible', 'true');
                simRight.setAttribute('position', '0.1 1.5 -0.5');
            } else if (e.key === '2') {
                simDetected = "Namaste";
                simLeft.setAttribute('visible', 'true');
                simRight.setAttribute('visible', 'true');
                simLeft.setAttribute('position', '-0.05 1.5 -0.5');
                simRight.setAttribute('position', '0.05 1.5 -0.5');
            } else if (e.key === '3') {
                simDetected = "Bye";
                simLeft.setAttribute('visible', 'false');
                simRight.setAttribute('visible', 'true');
                simRight.setAttribute('position', '0.2 1.6 -0.5');
            }

            if (simDetected) {
                updateUI(simDetected, performance.now());
            }
        });
    </script>
</body>
</html>
